<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Lesson - LearnLingo AI</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <style>

        .edit-page {
            min-height: 100vh;
            padding: 40px 20px;
        }

        .edit-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .edit-header {
            margin-bottom: 25px;
        }

        .edit-header h1 {
            margin-bottom: 8px;
        }

        .edit-header p {
            margin: 0;
            opacity: 0.8;
        }

        .edit-card {
            padding: 28px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
        }

        .edit-card label {
            display: block;
            margin-top: 16px;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .edit-card input,
        .edit-card textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
        }

        .edit-card textarea {
            min-height: 240px;
            resize: vertical;
            line-height: 1.6;
        }

        .edit-card input:focus,
        .edit-card textarea:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        .edit-actions {
            margin-top: 24px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .save-button,
        .cancel-button {
            display: inline-block;
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        .save-button {
            background: #4f46e5;
            color: white;
        }

        .cancel-button {
            background: #e5e7eb;
            color: #111827;
        }

        .edit-note {
            margin-top: 18px;
            padding: 12px 14px;
            border-radius: 10px;
            background: #f8fafc;
            font-size: 14px;
            line-height: 1.5;
        }

        @media (max-width: 600px) {

            .edit-page {
                padding: 24px 14px;
            }

            .edit-card {
                padding: 20px;
            }

            .edit-actions {
                flex-direction: column;
            }

            .save-button,
            .cancel-button {
                width: 100%;
                text-align: center;
            }

        }

    </style>

</head>

<body>

    <div class="edit-page">

        <div class="edit-container">

            <div class="edit-header">

                <h1>
                    ✏️ Edit Lesson
                </h1>

                <p>
                    Update your lesson details below.
                </p>

            </div>


            <div class="edit-card">

                <form
                    method="POST"
                    action="{{ url_for('edit_lesson', lesson_id=lesson['id']) }}"
                >

                    <label for="class_name">
                        Class
                    </label>

                    <input
                        type="text"
                        id="class_name"
                        name="class_name"
                        value="{{ lesson['class_name'] }}"
                        required
                    >


                    <label for="subject">
                        Subject
                    </label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        value="{{ lesson['subject'] }}"
                        required
                    >


                    <label for="title">
                        Lesson Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        value="{{ lesson['title'] }}"
                        required
                    >


                    <label for="content">
                        Lesson Content
                    </label>

                    <textarea
                        id="content"
                        name="content"
                        required
                    >{{ lesson['content'] }}</textarea>


                    <div class="edit-actions">

                        <button
                            type="submit"
                            class="save-button"
                        >
                            💾 Save Changes
                        </button>


                        <a
                            href="{{ url_for('teacher') }}"
                            class="cancel-button"
                        >
                            ← Cancel
                        </a>

                    </div>


                    <div class="edit-note">

                        <strong>Note:</strong>
                        When the lesson content is edited,
                        previously generated translations,
                        simplified explanations and AI quiz cache
                        will be refreshed automatically.

                    </div>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
